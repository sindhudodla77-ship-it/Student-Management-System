<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">

    <style>
        input {
            padding: 10px;
            width: 250px;
            border: 1px solid #999;
            border-radius: 5px;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Student Registration</h1>

    <form id="studentForm">

        <label for="name">Student Name:</label><br>
        <input type="text" id="name" placeholder="Enter student name" required>
        <br><br>

        <label for="roll">Roll Number:</label><br>
        <input type="text" id="roll" placeholder="Enter roll number" required>
        <br><br>

        <label for="course">Course:</label><br>
        <input type="text" id="course" placeholder="Enter your course" required>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email" required>
        <br><br>

        <button type="submit">Register</button>

    </form>

    <div id="message"></div>

    <br>

    <a href="index.html">Back to Home</a>

    <script>
        document.getElementById("studentForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value;
            const roll = document.getElementById("roll").value;
            const course = document.getElementById("course").value;
            const email = document.getElementById("email").value;

            document.getElementById("message").innerHTML = `
                <h2>Registration Successful!</h2>
                <h3>Student Details</h3>
                <p><strong>Student Name:</strong> ${name}</p>
                <p><strong>Roll Number:</strong> ${roll}</p>
                <p><strong>Course:</strong> ${course}</p>
                <p><strong>Email:</strong> ${email}</p>
            `;

        });
    </script>

</body>
</html>
